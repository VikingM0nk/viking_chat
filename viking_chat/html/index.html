<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darkwood Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Rye&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root" class="hidden-feed">
    <div id="feed" aria-live="polite"></div>

    <div id="composer" class="composer hidden">
      <div id="suggestions" class="suggestions hidden"></div>
      <div class="composer-bar">
        <span id="mode-label" class="mode-label">Say</span>
        <input
          id="chat-input"
          type="text"
          maxlength="512"
          autocomplete="off"
          spellcheck="false"
          placeholder="Speak your mind…"
        />
        <kbd class="hint">Enter</kbd>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
